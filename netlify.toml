[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "dist"
  SECRETS_SCAN_OMIT_KEYS = "VITE_GEMINI_API_KEY,VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL,VITE_SUPABASE_PUBLISHABLE_KEY,SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,SUPABASE_JWKS_URL"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
